# Controlled #32 diagnostic only: not a required release or acceptance gate.
# Frozen source and original full linter scope/budgets; only analysis concurrency changes.
name: GC32 Mac lint diagnostic (concurrency 1)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gc32-mac-lint-diagnostic-${{ github.ref }}
  cancel-in-progress: false

env:
  DOLT_VERSION: "2.1.7"
  BD_VERSION: "v1.3.0"

jobs:
  runner-policy:
    name: Diagnostic / runner policy
    runs-on: ${{ inputs.force_blacksmith && 'blacksmith-2vcpu-ubuntu-2404' || (github.event_name == 'pull_request' && contains(fromJSON('["julianknutsen","csells","sjarmak","quad341"]'), github.event.pull_request.user.login) && 'blacksmith-2vcpu-ubuntu-2404' || 'ubuntu-latest') }}
    outputs:
      use_blacksmith: ${{ steps.policy.outputs.use_blacksmith }}
      reason: ${{ steps.policy.outputs.reason }}
      runner_2vcpu: ${{ steps.policy.outputs.runner_2vcpu }}
      runner_8vcpu: ${{ steps.policy.outputs.runner_8vcpu }}
      runner_16vcpu: ${{ steps.policy.outputs.runner_16vcpu }}
      runner_32vcpu: ${{ steps.policy.outputs.runner_32vcpu }}
      runner_macos: ${{ steps.policy.outputs.runner_macos }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Select runner backend
        id: policy
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          FORCE_BLACKSMITH: ${{ inputs.force_blacksmith }}
        run: |
          python3 .github/workflows/scripts/runner_policy.py

  mac-quality:
    name: Diagnostic / full Mac lint (concurrency 1)
    needs:
      - runner-policy
    runs-on: ${{ needs.runner-policy.outputs.runner_macos }}
    # Cold lint exceeded 33 minutes before fmt/vet/docs could start. This
    # bounds total runner occupancy; it does not relax any command/test gate.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: AlexBelous/gascity
          ref: d262605c9822761bfe667c40d045e718e957cc17
          persist-credentials: false
      - name: Verify frozen diagnostic source
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = d262605c9822761bfe667c40d045e718e957cc17
      - uses: ./.github/actions/setup-gascity-macos
        with:
          dolt-version: ${{ env.DOLT_VERSION }}
          bd-version: ${{ env.BD_VERSION }}
          install-claude-cli: "false"
      - name: Install tools
        run: make install-tools
      - name: Get golangci-lint + Go toolchain versions for cache key
        id: glint-version
        run: |
          version=$(grep -m1 '^GOLANGCI_LINT_VERSION := ' Makefile | awk '{print $3}')
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          # staticcheck (bundled in golangci-lint) caches type/CFG facts whose
          # validity depends on the Go toolchain it was built with. Keying the
          # cache on GOVERSION prevents a cache populated under one Go toolchain
          # from being replayed under another, which produced a stale-fact
          # SA5011 false-positive flood on main (ga-v7x9vk).
          echo "goversion=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"
      - name: Restore golangci-lint cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/golangci-lint
          # Exact-key-only restore (no restore-keys fallback): a broad prefix
          # let a partial/incompatible cache (missing testing.T.Fatal no-return
          # facts) be inherited across differing keys and re-saved forward,
          # repeatedly re-poisoning the cache with a SA5011 false-positive
          # storm (ga-35qn7i, ga-v7x9vk, ga-l14mnf, ga-ndx34y). A miss now
          # forces a fully fresh, never-poisoned recompute.
          key: ${{ runner.os }}-golangci-lint-${{ steps.glint-version.outputs.version }}-${{ steps.glint-version.outputs.goversion }}-${{ hashFiles('go.sum', '.golangci.yml') }}
      - name: Lint
        env:
          GOLANGCI_LINT_CACHE: ${{ github.workspace }}/.cache/golangci-lint
          GC32_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          # Standard ARM64 runners have 7 GB RAM. Leave headroom for the OS
          # and compiler children; retain the full package and linter set.
          diagnostics="$RUNNER_TEMP/gc-mac-lint-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$diagnostics"
          git rev-parse HEAD > "$diagnostics/source-sha.txt"
          printf '%s\n' "$GC32_WORKFLOW_SHA" > "$diagnostics/workflow-definition-sha.txt"
          lint_tool="$(go env GOPATH)/bin/golangci-lint"
          shasum -a 256 "$lint_tool" > "$diagnostics/linter-sha256.txt"
          "$lint_tool" version > "$diagnostics/tool-version.txt"
          go env GOVERSION >> "$diagnostics/tool-version.txt"
          sysctl hw.memsize hw.ncpu > "$diagnostics/host-before.txt"
          vm_stat >> "$diagnostics/host-before.txt"
          set +e
          python3 -S .github/workflows/scripts/mac_lint_guard.py \
            --diagnostics "$diagnostics" --timeout-seconds 2700 --grace-seconds 5 \
            -- make lint LINT_GOMEMLIMIT=3GiB \
            LINT_FLAGS="--concurrency=1 --timeout=45m --verbose --show-stats --cpu-profile-path=$diagnostics/cpu.pprof --mem-profile-path=$diagnostics/memory.pprof"
          lint_rc=$?
          set -e
          printf '%s\n' "$lint_rc" > "$diagnostics/lint-exit-code.txt"
          sysctl hw.memsize hw.ncpu > "$diagnostics/host-after.txt"
          vm_stat >> "$diagnostics/host-after.txt"
          exit "$lint_rc"
      - name: Upload lint diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mac-lint-diagnostics-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gc-mac-lint-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
