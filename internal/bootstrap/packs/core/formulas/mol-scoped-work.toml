description = """
Graph-first worktree lifecycle.

This is the built-in v2 workflow prototype for Gas City. It models work as an
explicit DAG with:

- a durable `body` scope bead
- explicit worktree setup and teardown
- first-class step beads that can be routed independently
- continuation metadata for same-session execution

Use this as the opt-in replacement for hierarchy-first single-session formulas.
"""
formula = "mol-scoped-work"

[requires]
formula_compiler = ">=2.0.0"

[vars]
[vars.base_branch]
description = "Base branch to branch from"
default = "main"

[vars.setup_command]
description = "Optional setup command (install deps, bootstrap tools)"
default = ""

[vars.typecheck_command]
description = "Optional typecheck command"
default = ""

[vars.lint_command]
description = "Optional lint command"
default = ""

[vars.build_command]
description = "Optional build command"
default = ""

[vars.test_command]
description = "Optional test command"
default = ""

[[steps]]
id = "load-context"
title = "Load context and inspect the assignment"
description = """
Prime the workspace, inspect the assigned work, and understand the current bead
metadata before doing anything destructive.

```bash
gc prime
gc bd prime
CONVOY_STATUS=$(gc convoy status {{convoy_id}} --json)
WORK_BEAD_ID=$(printf '%s' "$CONVOY_STATUS" | jq -r 'if (.children | length) == 1 then .children[0].id else empty end')
if [ -z "$WORK_BEAD_ID" ]; then
  echo "mol-scoped-work requires an input convoy with exactly one tracked member" >&2
  exit 1
fi
gc bd show "$WORK_BEAD_ID"
gc bd show "$WORK_BEAD_ID" --json | jq '.[0].metadata'
gc mail inbox
```
"""
metadata = { "gc.continuation_group" = "main", "gc.session_affinity" = "require" }

[steps.retry]
max_attempts = 3
on_exhausted = "hard_fail"

[[steps]]
id = "body"
title = "Worktree body scope"
needs = ["workspace-setup", "preflight-tests", "implement", "self-review", "submit"]
description = """
Terminal latch for the main worktree body.

Normal work beads inside this scope can fail. Paired `scope-check` control
beads handle fail-fast skipping, close this bead with `gc.outcome=fail|pass`,
and allow teardown to proceed.
"""
metadata = { "gc.kind" = "scope", "gc.scope_name" = "worktree", "gc.scope_role" = "body" }

[[steps]]
id = "workspace-setup"
title = "Set up a worktree and branch"
needs = ["load-context"]
description = """
Ensure there is an isolated worktree for this work item.

```bash
set -euo pipefail
git fetch --prune origin
CONVOY_STATUS=$(gc convoy status {{convoy_id}} --json)
WORK_BEAD_ID=$(printf '%s' "$CONVOY_STATUS" | jq -r 'if (.children | length) == 1 then .children[0].id else empty end')
if [ -z "$WORK_BEAD_ID" ]; then
  echo "mol-scoped-work requires an input convoy with exactly one tracked member" >&2
  exit 1
fi
if [ -z "${GC_BEAD_ID:-}" ]; then
  echo "mol-scoped-work requires GC_BEAD_ID to resolve its source store" >&2
  exit 1
fi

REPO_ROOT=$(git rev-parse --show-toplevel)
WORKTREE_ROOT="${REPO_ROOT}-worktrees"
WORKTREE_PATH="$WORKTREE_ROOT/$WORK_BEAD_ID"
WORK_BRANCH="work/$WORK_BEAD_ID"
BASE_REF="origin/{{base_branch}}"
CREATOR="formula:mol-scoped-work"
OWNER="formula:mol-scoped-work"
GENERATION="formula:mol-scoped-work:$WORK_BEAD_ID"
LIFECYCLE="active"

STEP_JSON=$(gc bd show "$GC_BEAD_ID" --json)
STORE_REF=$(printf '%s' "$STEP_JSON" | jq -er '.[0].metadata["gc.root_store_ref"] | select(length > 0)')
WORK_JSON=$(gc bd show "$WORK_BEAD_ID" --json)
PUBLISHED_CANONICAL=$(printf '%s' "$WORK_JSON" | jq -r '.[0].metadata["gc.work_dir"] // empty')
PUBLISHED_LEGACY=$(printf '%s' "$WORK_JSON" | jq -r '.[0].metadata.work_dir // empty')
if [ -n "$PUBLISHED_CANONICAL" ] && [ -n "$PUBLISHED_LEGACY" ] && [ "$PUBLISHED_CANONICAL" != "$PUBLISHED_LEGACY" ]; then
  echo "mol-scoped-work found conflicting published worktree paths" >&2
  exit 1
fi
PUBLISHED_PATH="${PUBLISHED_CANONICAL:-$PUBLISHED_LEGACY}"
if [ -n "$PUBLISHED_PATH" ] && [ "$PUBLISHED_PATH" != "$WORKTREE_PATH" ]; then
  echo "mol-scoped-work refuses published worktree path outside its deterministic owner path" >&2
  exit 1
fi

ENSURE_ARGS=(
  --repo "$REPO_ROOT"
  --root "$WORKTREE_ROOT"
  --path "$WORKTREE_PATH"
  --branch "$WORK_BRANCH"
  --base "$BASE_REF"
  --bead "$WORK_BEAD_ID"
  --store-ref "$STORE_REF"
  --creator "$CREATOR"
  --owner "$OWNER"
  --generation "$GENERATION"
  --lifecycle "$LIFECYCLE"
  --json
)
PUBLISHED_BASE_SHA=$(printf '%s' "$WORK_JSON" | jq -r '.[0].metadata["gc.worktree_base_sha"] // empty')
if [ -n "$PUBLISHED_BASE_SHA" ]; then
  ENSURE_ARGS+=(--base-sha "$PUBLISHED_BASE_SHA")
fi
REPORT=$(gc worktree ensure "${ENSURE_ARGS[@]}")
printf '%s' "$REPORT" | jq -e \
  --arg path "$WORKTREE_PATH" \
  --arg branch "$WORK_BRANCH" \
  --arg bead "$WORK_BEAD_ID" \
  --arg store "$STORE_REF" \
  --arg base "$BASE_REF" \
  --arg creator "$CREATOR" \
  --arg owner "$OWNER" \
  --arg generation "$GENERATION" \
  --arg lifecycle "$LIFECYCLE" \
  '.path == $path and .branch == $branch and
   .provenance.bead_id == $bead and .provenance.store_ref == $store and
   .provenance.base_ref == $base and (.provenance.base_sha | length > 0) and
   .provenance.creator == $creator and .provenance.owner == $owner and
   .provenance.generation == $generation and .provenance.lifecycle == $lifecycle' \
  >/dev/null
BASE_SHA=$(printf '%s' "$REPORT" | jq -er '.provenance.base_sha | select(length > 0)')
gc bd update "$WORK_BEAD_ID" \
  --set-metadata "gc.work_dir=$WORKTREE_PATH" \
  --set-metadata "work_dir=$WORKTREE_PATH" \
  --set-metadata "gc.work_branch=$WORK_BRANCH" \
  --set-metadata "gc.worktree_repo=$REPO_ROOT" \
  --set-metadata "gc.worktree_root=$WORKTREE_ROOT" \
  --set-metadata "gc.worktree_base_ref=$BASE_REF" \
  --set-metadata "gc.worktree_base_sha=$BASE_SHA" \
  --set-metadata "gc.worktree_creator=$CREATOR" \
  --set-metadata "gc.worktree_owner=$OWNER" \
  --set-metadata "gc.worktree_generation=$GENERATION" \
  --set-metadata "gc.worktree_lifecycle=$LIFECYCLE"

WORKTREE="$WORKTREE_PATH"
cd "$WORKTREE"
{{setup_command}}
```
"""
metadata = { "gc.scope_ref" = "body", "gc.scope_role" = "setup", "gc.on_fail" = "abort_scope", "gc.continuation_group" = "main", "gc.session_affinity" = "require" }

[steps.retry]
max_attempts = 3
on_exhausted = "hard_fail"

[[steps]]
id = "preflight-tests"
title = "Run preflight checks on the base branch"
needs = ["workspace-setup"]
description = """
Run the configured checks before implementation.

```bash
{{typecheck_command}}
{{lint_command}}
{{test_command}}
```
"""
metadata = { "gc.scope_ref" = "body", "gc.scope_role" = "member", "gc.on_fail" = "abort_scope", "gc.continuation_group" = "main", "gc.session_affinity" = "require" }

[steps.retry]
max_attempts = 3
on_exhausted = "hard_fail"

[[steps]]
id = "implement"
title = "Implement the requested change"
needs = ["preflight-tests"]
description = """
Make the code changes for convoy `{{convoy_id}}` in the worktree. Commit focused changes
as needed and keep the branch scoped to this work.
"""
metadata = { "gc.scope_ref" = "body", "gc.scope_role" = "member", "gc.on_fail" = "abort_scope", "gc.continuation_group" = "main", "gc.session_affinity" = "require" }

[steps.retry]
max_attempts = 3
on_exhausted = "hard_fail"

[[steps]]
id = "self-review"
title = "Review the diff and run verification"
needs = ["implement"]
description = """
Inspect the change and run verification commands.

```bash
git diff origin/{{base_branch}}...HEAD
{{typecheck_command}}
{{lint_command}}
{{build_command}}
{{test_command}}
git status
```
"""
metadata = { "gc.scope_ref" = "body", "gc.scope_role" = "member", "gc.on_fail" = "abort_scope", "gc.continuation_group" = "main", "gc.session_affinity" = "require" }

[steps.retry]
max_attempts = 3
on_exhausted = "hard_fail"

[[steps]]
id = "submit"
title = "Finalize the work item"
needs = ["self-review"]
description = """
Perform the city-specific finalization for this work item. Examples:

- push the branch and hand off to a reviewer
- close the original work bead
- update metadata for downstream systems

This is intentionally generic so cities can opt into the graph contract
without inheriting Gastown's exact human workflow.
"""
metadata = { "gc.scope_ref" = "body", "gc.scope_role" = "member", "gc.on_fail" = "abort_scope", "gc.continuation_group" = "main", "gc.session_affinity" = "require" }

[steps.retry]
max_attempts = 3
on_exhausted = "hard_fail"

[[steps]]
id = "cleanup-worktree"
title = "Clean up the worktree"
needs = ["body"]
description = """
Remove the temporary worktree after the body reaches terminal state.

```bash
CONVOY_STATUS=$(gc convoy status {{convoy_id}} --json)
WORK_BEAD_ID=$(printf '%s' "$CONVOY_STATUS" | jq -r 'if (.children | length) == 1 then .children[0].id else empty end')
if [ -z "$WORK_BEAD_ID" ]; then
  echo "mol-scoped-work requires an input convoy with exactly one tracked member" >&2
  exit 1
fi
WORKTREE=$(gc bd show "$WORK_BEAD_ID" --json | jq -r '.[0].metadata.work_dir // empty')
if [ -n "$WORKTREE" ] && [ -d "$WORKTREE" ]; then
  git worktree remove --force "$WORKTREE" || rm -rf "$WORKTREE"
fi
gc bd update "$WORK_BEAD_ID" --unset-metadata work_dir
```
"""
metadata = { "gc.kind" = "cleanup", "gc.scope_ref" = "body", "gc.scope_role" = "teardown" }

[steps.retry]
max_attempts = 3
on_exhausted = "hard_fail"
