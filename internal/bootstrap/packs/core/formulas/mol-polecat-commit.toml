description = """
Polecat direct-commit variant — commits directly to base_branch.

Extends mol-polecat-base with a simplified workspace setup (a unique local
work branch based on base_branch) and direct push to base_branch instead of
refinery submission. Designed for small installations where merge review is
unnecessary.

## Polecat Contract (Direct-Commit Model)

1. Receive work (molecule poured with this formula, assigned to you)
2. Follow steps in order (read descriptions, execute, move to next)
3. Commit to base_branch, push, close bead, exit
4. You are GONE — no refinery step needed

**No review branch.** Work uses a unique local branch for worktree ownership,
then pushes its HEAD directly to base_branch.
Push conflicts are handled by fetch + rebase + retry (up to 3 times).

## Failure Modes

| Situation | Action |
|-----------|--------|
| Tests fail | Fix them. Do not proceed with failures. |
| Push conflict (3 retries exhausted) | Mail Witness, mark yourself stuck |
| Blocked on external | Mail Witness, mark yourself stuck |
| Context filling | `gc runtime request-restart` (blocks until controller kills you) |
| Unsure what to do | Mail Witness, don't guess |"""
formula = "mol-polecat-commit"
extends = ["mol-polecat-base"]

[requires]
formula_compiler = ">=2.0.0"

[[steps]]
id = "workspace-setup"
title = "Set up owned worktree from base branch"
needs = ["load-context"]
description = """
Create an isolated worktree on a unique local branch based at base_branch HEAD.
The commit step pushes that local branch directly to base_branch.

**Config: base_branch = {{base_branch}}**
**Config: setup_command = {{setup_command}}**

```bash
set -euo pipefail
git fetch --prune origin
CONVOY_STATUS=$(gc convoy status {{convoy_id}} --json)
WORK_BEAD_ID=$(printf '%s' "$CONVOY_STATUS" | jq -r 'if (.children | length) == 1 then .children[0].id else empty end')
if [ -z "$WORK_BEAD_ID" ]; then
  echo "mol-polecat-commit requires an input convoy with exactly one tracked member" >&2
  exit 1
fi
if [ -z "${GC_BEAD_ID:-}" ]; then
  echo "mol-polecat-commit requires GC_BEAD_ID to resolve its source store" >&2
  exit 1
fi

REPO_ROOT=$(git rev-parse --show-toplevel)
WORKTREE_ROOT="${REPO_ROOT}-worktrees"
WORKTREE_PATH="$WORKTREE_ROOT/$WORK_BEAD_ID"
WORK_BRANCH="work/$WORK_BEAD_ID"
BASE_REF="origin/{{base_branch}}"
CREATOR="formula:mol-polecat-commit"
OWNER="formula:mol-polecat-commit"
GENERATION="formula:mol-polecat-commit:$WORK_BEAD_ID"
LIFECYCLE="active"

STEP_JSON=$(gc bd show "$GC_BEAD_ID" --json)
STORE_REF=$(printf '%s' "$STEP_JSON" | jq -er '.[0].metadata["gc.root_store_ref"] | select(length > 0)')
WORK_JSON=$(gc bd show "$WORK_BEAD_ID" --json)
PUBLISHED_CANONICAL=$(printf '%s' "$WORK_JSON" | jq -r '.[0].metadata["gc.work_dir"] // empty')
PUBLISHED_LEGACY=$(printf '%s' "$WORK_JSON" | jq -r '.[0].metadata.work_dir // empty')
if [ -n "$PUBLISHED_CANONICAL" ] && [ -n "$PUBLISHED_LEGACY" ] && [ "$PUBLISHED_CANONICAL" != "$PUBLISHED_LEGACY" ]; then
  echo "mol-polecat-commit found conflicting published worktree paths" >&2
  exit 1
fi
PUBLISHED_PATH="${PUBLISHED_CANONICAL:-$PUBLISHED_LEGACY}"
if [ -n "$PUBLISHED_PATH" ] && [ "$PUBLISHED_PATH" != "$WORKTREE_PATH" ]; then
  echo "mol-polecat-commit refuses published worktree path outside its deterministic owner path" >&2
  exit 1
fi

ENSURE_ARGS=(
  --repo "$REPO_ROOT"
  --root "$WORKTREE_ROOT"
  --path "$WORKTREE_PATH"
  --branch "$WORK_BRANCH"
  --base "$BASE_REF"
  --bead "$WORK_BEAD_ID"
  --store-ref "$STORE_REF"
  --creator "$CREATOR"
  --owner "$OWNER"
  --generation "$GENERATION"
  --lifecycle "$LIFECYCLE"
  --json
)
PUBLISHED_BASE_SHA=$(printf '%s' "$WORK_JSON" | jq -r '.[0].metadata["gc.worktree_base_sha"] // empty')
if [ -n "$PUBLISHED_BASE_SHA" ]; then
  ENSURE_ARGS+=(--base-sha "$PUBLISHED_BASE_SHA")
fi
REPORT=$(gc worktree ensure "${ENSURE_ARGS[@]}")
printf '%s' "$REPORT" | jq -e \
  --arg path "$WORKTREE_PATH" \
  --arg branch "$WORK_BRANCH" \
  --arg bead "$WORK_BEAD_ID" \
  --arg store "$STORE_REF" \
  --arg base "$BASE_REF" \
  --arg creator "$CREATOR" \
  --arg owner "$OWNER" \
  --arg generation "$GENERATION" \
  --arg lifecycle "$LIFECYCLE" \
  '.path == $path and .branch == $branch and
   .provenance.bead_id == $bead and .provenance.store_ref == $store and
   .provenance.base_ref == $base and (.provenance.base_sha | length > 0) and
   .provenance.creator == $creator and .provenance.owner == $owner and
   .provenance.generation == $generation and .provenance.lifecycle == $lifecycle' \
  >/dev/null
BASE_SHA=$(printf '%s' "$REPORT" | jq -er '.provenance.base_sha | select(length > 0)')
gc bd update "$WORK_BEAD_ID" \
  --set-metadata "gc.work_dir=$WORKTREE_PATH" \
  --set-metadata "work_dir=$WORKTREE_PATH" \
  --set-metadata "gc.work_branch=$WORK_BRANCH" \
  --set-metadata "gc.worktree_repo=$REPO_ROOT" \
  --set-metadata "gc.worktree_root=$WORKTREE_ROOT" \
  --set-metadata "gc.worktree_base_ref=$BASE_REF" \
  --set-metadata "gc.worktree_base_sha=$BASE_SHA" \
  --set-metadata "gc.worktree_creator=$CREATOR" \
  --set-metadata "gc.worktree_owner=$OWNER" \
  --set-metadata "gc.worktree_generation=$GENERATION" \
  --set-metadata "gc.worktree_lifecycle=$LIFECYCLE"

cd "$WORKTREE_PATH"
git status
{{setup_command}}
```
Empty setup_command → skip.

**Exit criteria:** In the verified owned worktree on its unique local branch,
deps installed and complete provenance recorded atomically on the bead."""

[[steps]]
id = "commit-and-push"
title = "Commit to base branch, push, and exit"
needs = ["self-review"]
description = """
Commit your work directly to base_branch and push. You cease to exist
after this step.

**1. Derive your work bead and verify clean state (safeguard):**
```bash
CONVOY_STATUS=$(gc convoy status {{convoy_id}} --json)
WORK_BEAD_ID=$(printf '%s' "$CONVOY_STATUS" | jq -r 'if (.children | length) == 1 then .children[0].id else empty end')
git status --porcelain
```
If ANY output (untracked files, uncommitted changes):
```bash
git add -A && git commit -m "chore: capture remaining work ($WORK_BEAD_ID)"
```

**2. Push to base_branch with conflict retry (up to 3 attempts):**

```bash
for attempt in 1 2 3; do
    if git push origin HEAD:{{base_branch}}; then
        echo "Push succeeded on attempt $attempt"
        break
    fi
    if [ "$attempt" -eq 3 ]; then
        echo "Push failed after 3 attempts"
        gc mail send <rig>/witness -s "HELP: Push conflict after 3 retries" \
          -m "Issue: $WORK_BEAD_ID. Cannot push to {{base_branch}}."
        gc runtime drain-ack
        exit 1
    fi
    echo "Push failed (attempt $attempt), rebasing..."
    git fetch origin {{base_branch}}
    git rebase origin/{{base_branch}}
    # If rebase conflicts: resolve them, then git rebase --continue
done
```

**3. Clean up worktree:**
```bash
WORKTREE_PATH=$(pwd)
cd ..
git worktree remove "$WORKTREE_PATH" --force
gc bd update "$WORK_BEAD_ID" --unset-metadata work_dir
```

**4. Close the bead:**
```bash
gc bd update "$WORK_BEAD_ID" --notes "Committed directly to {{base_branch}}: <brief summary>"
gc bd close "$WORK_BEAD_ID"
```

**5. Signal reconciler and exit.**
```bash
gc runtime drain-ack
exit
```

`gc runtime drain-ack` tells the reconciler to kill this session. The
reconciler only restarts you if the pool check command finds more work.
You are GONE. Done means gone. There is no idle state.

**Exit criteria:** Changes pushed to {{base_branch}}, worktree cleaned up,
bead closed, session exited."""
