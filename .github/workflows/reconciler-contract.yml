name: Reconciler contract

on:
  pull_request_target:

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Collect triggering pull request filenames
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CHANGED_FILES_PATH: ${{ runner.temp }}/reconciler-contract-changed-files.json
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" > "${CHANGED_FILES_PATH}"

      - name: Fetch and verify frozen Git objects
        shell: bash
        run: |
          set -euo pipefail
          env -u GIT_REPLACE_REF_BASE -u GIT_REPLACE_REF_OBJECT -u GIT_GRAFT_FILE \
            git fetch --no-tags origin 8941d74287bed229261fe56c246845d4db67f6cd
          env -u GIT_REPLACE_REF_BASE -u GIT_REPLACE_REF_OBJECT -u GIT_GRAFT_FILE \
            git fetch --no-tags origin 7bf106acdcd23caf423d5d4a2322af2638cfb60b
          for object in \
            8941d74287bed229261fe56c246845d4db67f6cd \
            5cb7a6244b11961cc2387c663d73912f41c6d7df \
            baa2cb29560d4d5161c33a880a2eba7fe04938bd \
            f960809fd9a28316a08d25c785e4284190fe0950 \
            87e2f7acd36bdca96fcfecd090257409d8e31ea5 \
            07496a454de90bf1f1cc6727f9ba754ced644ec8 \
            eefc251794e2a9a2420a034bd4ddcfce865eb947 \
            7bf106acdcd23caf423d5d4a2322af2638cfb60b \
            e32dacde926f7e678b03abf857b2e199491ecebe \
            2fef0322954c06408c669022a9303662244abe9c; do
            env -u GIT_REPLACE_REF_BASE -u GIT_REPLACE_REF_OBJECT -u GIT_GRAFT_FILE \
              git cat-file -e "${object}^{object}"
          done

      - name: Verify the base-owned contract
        env:
          RECONCILER_CONTRACT_CHANGED_FILES: ${{ runner.temp }}/reconciler-contract-changed-files.json
          RECONCILER_CONTRACT_CHANGED_FILE_COUNT: ${{ github.event.pull_request.changed_files }}
        shell: bash
        run: |
          set -euo pipefail
          env -u GIT_REPLACE_REF_BASE -u GIT_REPLACE_REF_OBJECT -u GIT_GRAFT_FILE \
            go test -tags reconciler_contract -count=1 ./test/docsync
