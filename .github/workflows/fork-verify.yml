name: fork-verify

# Minimal fork-only CI for gascity forks. Verifies WIP feature branches
# WITHOUT upstream's Blacksmith
# self-hosted runners, runner-policy gating, or secrets — none of which a fork
# has. ubuntu-latest compiles the Dolt go-icu-regex CGO dependency cleanly; the
# `unicode/regex.h` build failure is macOS-only (icu4c@78 header layout), so a
# Linux runner is exactly what's needed to get a real green/red signal.
#
# Reuses the upstream composite action .github/actions/setup-gascity-ubuntu so
# the Go + Dolt + native-dependency setup is not re-solved here.

on:
  push:
    branches: ["feat/**", "fix/**"]
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: "Exact reviewed 40-hex source for isolated targeted tests and gc/helper artifacts"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  verify:
    # Canonical PR branches already run the complete Blacksmith CI graph.
    # This lightweight fallback exists only for forks that cannot use those
    # runners or repository secrets.
    if: ${{ github.repository != 'gastownhall/gascity' }}
    runs-on: ubuntu-latest
    env:
      DOLT_VERSION: "2.1.7"
      BD_VERSION: "v1.3.0"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ./.github/actions/setup-gascity-ubuntu
        with:
          dolt-version: ${{ env.DOLT_VERSION }}
          bd-version: ${{ env.BD_VERSION }}
          install-claude-cli: "false"
      - name: Build (compiles the whole tree — catches compile errors the macOS ICU break hides)
        run: go build ./...
      - name: Vet changed package
        run: go vet ./cmd/gc/...
      - name: Unit tests — cross-store work delivery
        run: go test ./cmd/gc/ -run 'TestFilterAssignedWorkBeads|TestAssignedWork|TestFirstStoreWithWork|TestCrossStoreClaimDir|TestRunBDForBead|TestGateOpenWorkBounded|TestCrossStorePipeline' -count=1 -v
      - name: Unit tests — cross-store reachability predicate + fail-loud guard
        run: |
          go test ./internal/agentutil/ -run 'TestAgentReachesWorkflowStore|TestAgentIsCrossStoreEligible' -count=1 -v
          go test ./internal/sling/ -run 'TestValidateBuiltInRouteStoreReachableAllowsCityScopedTarget|TestDoSlingRefusesCrossStore' -count=1 -v
      - name: Unit tests — order scope (#2830)
        run: go test ./internal/orders/ -run 'TestParseScope|TestValidateRejectsUnknownScope|TestValidateAcceptsCityAndRigScope|TestParseEnv' -count=1 -v
      - name: Unit tests — scale from zero (#2819)
        run: go test ./cmd/gc/ -run 'TestBuildDesiredState_ScaleFromZero' -count=1 -v

  reviewed-clerk-pair:
    # Reuse this already registered dispatch path; no tag/release/deployment.
    if: ${{ github.repository == 'AlexBelous/gascity' && github.event_name == 'workflow_dispatch' && inputs.expected_source_sha != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EXPECTED_SOURCE: ${{ inputs.expected_source_sha }}
      GOMAXPROCS: "1"
      GOMEMLIMIT: "2GiB"
      CGO_ENABLED: "1"
      GOTOOLCHAIN: local
      GOFLAGS: "-p=1"
    steps:
      - name: Validate exact source input
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_SOURCE"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.expected_source_sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify immutable checkout and required scoped fixtures
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          test -z "$(git status --porcelain)"
          test -f tools/observation/proc-helper/census-comm-refresh-kernel-test.c
          test -f internal/runtime/procobserver/census_comm_birth_test.go
          grep -q 'func TestCapacityCapThreeBoundary' internal/session/admission_start_test.go
          mkdir -m 700 "$RUNNER_TEMP/clerk-pair"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/clerk-pair/source-tree.txt"
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: "1.26.6"
          cache: false
      - name: Install native build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libicu-dev pkg-config
          test "$(pkg-config --modversion icu-uc | cut -d. -f1)" = 74
          dpkg-query -W libicu-dev gcc libc6-dev > "$RUNNER_TEMP/clerk-pair/native-dependencies.txt"
          test "$(go env GOVERSION)" = go1.26.6
      - name: Scoped native cap and one-shot boundary tests
        shell: bash
        run: |
          set -euo pipefail
          go test -p 1 ./internal/session -run '^(TestCapacityCapThreeBoundary|TestManagedStartAdmissionSpendsGrantAtActualBoundary|TestCapacityAdmissionProofIsBoundedAndOneShot)$' -count=1 -json | tee "$RUNNER_TEMP/clerk-pair/native-tests.jsonl"
      - name: Native-owned admission and final model argument tests
        shell: bash
        run: |
          set -euo pipefail
          go test -p 1 ./internal/session -run '^TestNative' -count=1 -json | tee "$RUNNER_TEMP/clerk-pair/managed-native-tests.jsonl"
          go test -p 1 ./internal/runtime/tmux -run '^TestManagedScope' -count=1 -json | tee "$RUNNER_TEMP/clerk-pair/managed-model-tests.jsonl"
          go test -p 1 ./cmd/gc -run '^TestSessionCapacityContract' -count=1 -json | tee "$RUNNER_TEMP/clerk-pair/managed-contract-tests.jsonl"
          go test -p 1 ./internal/runtime -run '^(TestFingerprintPartitionAccountsForEveryConfigField|TestCommandScopeAttemptDoesNotChangeDesiredFingerprints|TestFingerprintGolden)$' -count=1 -json | tee "$RUNNER_TEMP/clerk-pair/managed-fingerprint-tests.jsonl"
          go test -p 1 ./scripts -run '^TestRuntimeTmuxManifest' -count=1 -json | tee "$RUNNER_TEMP/clerk-pair/managed-manifest-tests.jsonl"
          go test -p 1 ./internal/testpolicy/resourcecensus -run '^TestRepositoryLedgerMatchesCensusAndDocumentation$' -count=1 -json | tee "$RUNNER_TEMP/clerk-pair/managed-resource-ledger-tests.jsonl"
          go test -p 1 -c -ldflags='-s -w' -o "$RUNNER_TEMP/clerk-pair/native-session.test" ./internal/session
      - name: Owned-child comm capture and real C-to-Go wire
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/clerk-pair"
          cc -O1 -Wall -Wextra tools/observation/proc-helper/census-comm-refresh-kernel-test.c -o "$out/comm-kernel-test"
          "$out/comm-kernel-test" > "$out/comm-capture.log" 2>&1
          "$out/comm-kernel-test" continuation > "$out/comm-continuation.log" 2>&1
          "$out/comm-kernel-test" birth-change > "$out/comm-birth.log" 2>&1
          "$out/comm-kernel-test" birth-change-vector > "$out/comm-birth-vector.json" 2> "$out/comm-birth-vector.stderr"
          GC_COMM_BIRTH_VECTOR="$out/comm-birth-vector.json" go test -p 1 ./internal/runtime/procobserver -run '^TestCensusV3ManagedBirthComm(Refresh|OwnedVector)$' -count=1 -json | tee "$out/comm-go-tests.jsonl"
      - name: Owned V3 sender and fatal-stage regression tests
        shell: bash
        run: |
          set -euo pipefail
          make -C tools/observation/proc-helper send-test v3-fatal-test
      - name: Original FULL and initial-poll companion owned-child witness
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/clerk-pair"
          make -C tools/observation/proc-helper original-full-poll-test original-full-poll-kernel-test OUT="$out/poll-companion"
          GC_ORIGINAL_FULL_POLL_VECTOR="$out/poll-companion-original-full-poll-vector.json" go test -p 1 ./internal/runtime/procobserver -run '^TestOriginalFullPoll' -count=1 -v
      - name: Build coherent reviewed Linux pair
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/clerk-pair"
          test "$(df --output=avail -B1 "$RUNNER_TEMP" | tail -1 | tr -d ' ')" -ge 4294967296
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          test -z "$(git status --porcelain)"
          make build BUILD_DIR="$out" VERSION="$EXPECTED_SOURCE" COMMIT="$EXPECTED_SOURCE"
          make -C tools/observation/proc-helper build-v3 SOURCE_REVISION="$EXPECTED_SOURCE" OUT="$out/gc-process-observer-helper"
          go version -m "$out/gc" > "$out/gc-buildinfo.txt"
          readelf -h "$out/gc" > "$out/gc-elf.txt"
          readelf -h "$out/gc-process-observer-helper" > "$out/helper-elf.txt"
          mkdir -m 700 "$out/empty"
          (cd "$out/empty"; env -i HOME="$out/empty" PATH=/usr/bin:/bin "$out/gc" version --json) > "$out/gc-version.json"
          test -z "$(git status --porcelain)"
      - name: Record actual artifact hashes and scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import hashlib,json,os,pathlib,subprocess
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'clerk-pair'
          source=os.environ['EXPECTED_SOURCE']
          for log,required in [('native-tests.jsonl',{'TestCapacityCapThreeBoundary','TestManagedStartAdmissionSpendsGrantAtActualBoundary','TestCapacityAdmissionProofIsBoundedAndOneShot'}),('comm-go-tests.jsonl',{'TestCensusV3ManagedBirthCommRefresh','TestCensusV3ManagedBirthCommOwnedVector'}),('managed-native-tests.jsonl',{'TestNativeConcurrentLastSeatIsAtomic','TestNativeProofStartsExactlyOnceWithoutSnapshotOrScanner','TestNativeFailedOrNeverWitnessedStartRetainsSeatAcrossRestart','TestNativeKnownEmptyScopeReleasesButDescendantAndUnknownDoNot'}),('managed-model-tests.jsonl',{'TestManagedScopeWrapsFinalModelArgumentsAndLiteralPrompt','TestManagedScopeDescriptorAlsoWrapsRespawnAndInvalidScopeRefuses'}),('managed-contract-tests.jsonl',{'TestSessionCapacityContractReportsExactDedicatedReservation','TestSessionCapacityContractNativeModeDoesNotAdvertiseLegacyReservation'}),('managed-fingerprint-tests.jsonl',{'TestFingerprintPartitionAccountsForEveryConfigField','TestCommandScopeAttemptDoesNotChangeDesiredFingerprints','TestFingerprintGolden'}),('managed-manifest-tests.jsonl',{'TestRuntimeTmuxManifestMatchesCanonicalLinuxIntegrationInventory','TestRuntimeTmuxManifestSixShardsPartitionInventoryExactlyOnce'}),('managed-resource-ledger-tests.jsonl',{'TestRepositoryLedgerMatchesCensusAndDocumentation'})]:
              events=[json.loads(line) for line in (out/log).read_text().splitlines() if line.strip()]
              assert not any(e.get('Action') in ('skip','fail','build-fail') for e in events)
              passed={e.get('Test') for e in events if e.get('Action')=='pass'}
              assert required <= passed, (log,required-passed)
              assert any(e.get('Action')=='pass' and 'Test' not in e for e in events)
          version=json.loads((out/'gc-version.json').read_text())
          assert version['commit']==source and version['version']==source
          members=[]
          for name in ('gc','gc-process-observer-helper','native-session.test','native-tests.jsonl','managed-native-tests.jsonl','managed-model-tests.jsonl','managed-contract-tests.jsonl','managed-fingerprint-tests.jsonl','managed-manifest-tests.jsonl','managed-resource-ledger-tests.jsonl','comm-go-tests.jsonl','comm-birth-vector.json','gc-buildinfo.txt','gc-version.json','native-dependencies.txt'):
              p=out/name
              members.append({'path':name,'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          m={'schema':1,'source':source,'source_tree':(out/'source-tree.txt').read_text().strip(),'go':'1.26.6','target':'linux/amd64','icu_major':74,'helper_source_revision':source,'code_and_build_only':True,'full_suite_complete':False,'production_effects':False,'native_live_admission':False,'members':members}
          (out/'PAIR-MANIFEST.json').write_text(json.dumps(m,indent=2)+'\n')
          PYCODE
          tar -C "$RUNNER_TEMP/clerk-pair" -czf "$RUNNER_TEMP/reviewed-clerk-pair.tar.gz" .
          sha256sum "$RUNNER_TEMP/reviewed-clerk-pair.tar.gz" > "$RUNNER_TEMP/reviewed-clerk-pair.tar.gz.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: reviewed-clerk-pair-${{ inputs.expected_source_sha }}
          path: |
            ${{ runner.temp }}/reviewed-clerk-pair.tar.gz
            ${{ runner.temp }}/reviewed-clerk-pair.tar.gz.sha256
            ${{ runner.temp }}/clerk-pair/*.jsonl
            ${{ runner.temp }}/clerk-pair/*.json
            ${{ runner.temp }}/clerk-pair/*.txt
            ${{ runner.temp }}/clerk-pair/*.log
            ${{ runner.temp }}/clerk-pair/*.stderr
          if-no-files-found: error
          retention-days: 14
