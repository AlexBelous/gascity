name: GC32 Linux topology diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gc32-topology-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  runner-policy:
    name: Diagnostic runner policy
    runs-on: ${{ inputs.force_blacksmith && 'blacksmith-2vcpu-ubuntu-2404' || (github.event_name == 'pull_request' && contains(fromJSON('["julianknutsen","csells","sjarmak","quad341"]'), github.event.pull_request.user.login) && 'blacksmith-2vcpu-ubuntu-2404' || 'ubuntu-latest') }}
    outputs:
      use_blacksmith: ${{ steps.policy.outputs.use_blacksmith }}
      reason: ${{ steps.policy.outputs.reason }}
      runner_2vcpu: ${{ steps.policy.outputs.runner_2vcpu }}
      runner_8vcpu: ${{ steps.policy.outputs.runner_8vcpu }}
      runner_16vcpu: ${{ steps.policy.outputs.runner_16vcpu }}
      runner_32vcpu: ${{ steps.policy.outputs.runner_32vcpu }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Select runner backend
        id: policy
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          FORCE_BLACKSMITH: ${{ inputs.force_blacksmith }}
        run: |
          python3 .github/workflows/scripts/runner_policy.py

  beads-topology-acceptance:
    name: Diagnostic / unchanged proxied-default owner
    needs:
      - runner-policy
    runs-on: ${{ needs.runner-policy.outputs.runner_32vcpu }}
    timeout-minutes: 105
    env:
      DOLT_VERSION: "2.1.7"
      GC_REQUIRE_ACCEPTANCE_TOOLING: "1"
      # Tier A skips the matrix to stay a smoke tier. This is the job that runs
      # it, so this is the job that opts in.
      GC_ACCEPTANCE_TOPOLOGY_MATRIX: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Retain diagnostic observer from definition
        run: |
          cp .github/workflows/scripts/gc32_topology_observer.py "$RUNNER_TEMP/gc32_topology_observer.py"
          sha256sum "$RUNNER_TEMP/gc32_topology_observer.py" > "$RUNNER_TEMP/observer-sha256.txt"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: AlexBelous/gascity
          ref: d262605c9822761bfe667c40d045e718e957cc17
          persist-credentials: false
      - name: Verify source and first attempt
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = d262605c9822761bfe667c40d045e718e957cc17
          test "$(git rev-parse HEAD^{tree})" = a39288a12f8af15d15cbc7f0655fa8507250d3e8
      # bd-version is empty: this job builds bd from BD_CURRENT_REF below,
      # exactly as contract-acceptance-current does, so the bd on PATH and the
      # beads library in go.mod reach the same upstream commit.
      - uses: ./.github/actions/setup-gascity-ubuntu
        with:
          dolt-version: ${{ env.DOLT_VERSION }}
          bd-version: ""
          install-claude-cli: "false"
      - name: Resolve bd current pin
        id: bd
        run: |
          set -euo pipefail
          ref="$(grep -E '^BD_CURRENT_REF=' deps.env | cut -d= -f2)"
          ver="$(grep -E '^BD_CURRENT_VERSION=' deps.env | cut -d= -f2)"
          if [ -z "$ref" ] || [ -z "$ver" ]; then
            echo "::error::BD_CURRENT_REF/BD_CURRENT_VERSION missing or empty in deps.env" >&2
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
      - name: Build bd ${{ steps.bd.outputs.ver }} from source @ ${{ steps.bd.outputs.ref }}
        run: |
          set -euo pipefail
          src="${RUNNER_TEMP}/beads-src"
          git clone --filter=blob:none https://github.com/gastownhall/beads "$src"
          git -C "$src" checkout "${{ steps.bd.outputs.ref }}"
          mkdir -p "${HOME}/.local/bin"
          go -C "$src" build -tags gms_pure_go -o "${HOME}/.local/bin/bd" ./cmd/bd
          echo "GC_ACCEPTANCE_BD_BIN=${HOME}/.local/bin/bd" >> "$GITHUB_ENV"
          echo "${HOME}/.local/bin" >> "$GITHUB_PATH"
      # Fail here rather than inside a test: a bd that is missing or too old is
      # a broken job, and the tests below would otherwise be asked to decide it
      # one skip at a time.
      - name: Verify bd supports proxied-server
        run: |
          set -euo pipefail
          bd version
          if ! bd init --help | grep -q -- --proxied-server; then
            echo "::error::bd at $(command -v bd) has no --proxied-server support" >&2
            exit 1
          fi
          dolt version
      - name: One unchanged whole proxied-default owner with bounded observer
        env:
          GC32_DEFINITION_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          diagnostics="$RUNNER_TEMP/gc32-topology-diagnostics"
          mkdir "$diagnostics"
          cp "$RUNNER_TEMP/observer-sha256.txt" "$diagnostics/"
          git rev-parse HEAD > "$diagnostics/source-sha.txt"
          git rev-parse HEAD^{tree} > "$diagnostics/source-tree-before.txt"
          git status --porcelain > "$diagnostics/source-status-before.txt"
          test ! -s "$diagnostics/source-status-before.txt"
          printf '%s\n' "$GC32_DEFINITION_SHA" > "$diagnostics/definition-sha.txt"
          go version > "$diagnostics/tools.txt"
          bd version >> "$diagnostics/tools.txt"
          dolt version >> "$diagnostics/tools.txt"
          sha256sum "$(command -v bd)" "$(command -v dolt)" >> "$diagnostics/tools.txt"
          git -C "$RUNNER_TEMP/beads-src" rev-parse HEAD >> "$diagnostics/tools.txt"
          export TMPDIR
          TMPDIR="$(mktemp -d /tmp/gc32t.XXXXXXXX)"
          printf '%s\n' "$TMPDIR" > "$diagnostics/owned-tmpdir.txt"
          python3 "$RUNNER_TEMP/gc32_topology_observer.py" "$TMPDIR" "$diagnostics/observer" > "$diagnostics/observer.stdout" 2> "$diagnostics/observer.stderr" &
          observer_pid=$!
          trap 'touch "$diagnostics/observer-stop"; wait "$observer_pid" || true' EXIT
          for attempt in $(seq 1 30); do
            test -f "$diagnostics/observer/ready" && break
            kill -0 "$observer_pid"
            sleep 1
          done
          test -f "$diagnostics/observer/ready"
          set +e
          go test -tags acceptance_a -timeout 30m -count=1 -v \
            -run 'TestBeadsProxiedDefault$' ./test/acceptance/ 2>&1 \
            | tee "$diagnostics/proxied-default.log"
          pipeline=("${PIPESTATUS[@]}")
          set -e
          touch "$diagnostics/observer-stop"
          set +e
          wait "$observer_pid"
          observer_rc=$?
          set -e
          trap - EXIT
          git rev-parse HEAD > "$diagnostics/source-sha-after.txt"
          git rev-parse HEAD^{tree} > "$diagnostics/source-tree-after.txt"
          git status --porcelain > "$diagnostics/source-status-after.txt"
          source_rc=0
          cmp "$diagnostics/source-sha.txt" "$diagnostics/source-sha-after.txt" || source_rc=1
          cmp "$diagnostics/source-tree-before.txt" "$diagnostics/source-tree-after.txt" || source_rc=1
          test ! -s "$diagnostics/source-status-after.txt" || source_rc=1
          printf '{"test_rc":%s,"tee_rc":%s,"observer_rc":%s,"source_rc":%s}\n' "${pipeline[0]}" "${pipeline[1]}" "$observer_rc" "$source_rc" > "$diagnostics/result.json"
          if [ "${pipeline[0]}" -ne 0 ]; then exit "${pipeline[0]}"; fi
          test "$source_rc" -eq 0
          test "${pipeline[1]}" -eq 0
          test "$observer_rc" -eq 0
      - name: Upload diagnostic evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gc32-topology-diagnostic-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gc32-topology-diagnostics/
          if-no-files-found: error
